<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>陆沉 · 学习守夜人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#241a2e;
    --bg-card:#33253f;
    --bg-card-2:#3d2c4a;
    --text-warm:#f2e6d8;
    --text-dim:#b3a1c2;
    --accent-gold:#d9a75a;
    --accent-gold-soft:#e8c98a;
    --accent-coral:#e0785f;
    --accent-sage:#93b58c;
    --line-hair:rgba(242,230,216,0.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:radial-gradient(ellipse at 50% -10%, #3a2a48 0%, var(--bg-deep) 55%);
    color:var(--text-warm);
    font-family:"Noto Sans SC",sans-serif;
    min-height:100dvh;
    overflow-x:hidden;
  }
  #app{max-width:480px;margin:0 auto;padding:28px 20px 100px;position:relative;}

  /* ---- signature element: the breathing lamp ---- */
  .lamp-wrap{display:flex;flex-direction:column;align-items:center;padding:18px 0 8px;}
  .lamp{
    width:92px;height:92px;border-radius:50%;position:relative;
    background:radial-gradient(circle at 35% 30%, var(--accent-gold-soft), var(--accent-gold) 55%, #8a5a22 100%);
    box-shadow:0 0 30px 6px rgba(217,167,90,0.35), inset 0 0 18px rgba(255,235,200,0.5);
    animation:breathe 4.2s ease-in-out infinite;
    transition:background 0.8s ease, box-shadow 0.8s ease;
  }
  .lamp.urging{animation-duration:1.8s; box-shadow:0 0 34px 8px rgba(224,120,95,0.45), inset 0 0 18px rgba(255,220,200,0.5);}
  .lamp.locked{animation:none; background:radial-gradient(circle at 35% 30%, #7a5a48, #4a3438 60%, #2c1f26 100%); box-shadow:0 0 22px 4px rgba(224,120,95,0.25), inset 0 0 14px rgba(0,0,0,0.4);}
  .lamp.bloom{animation-duration:3s; box-shadow:0 0 46px 14px rgba(217,167,90,0.55), inset 0 0 22px rgba(255,245,220,0.7);}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  .lamp-name{font-family:"Noto Serif SC",serif;font-weight:700;letter-spacing:0.12em;margin-top:14px;font-size:15px;color:var(--accent-gold-soft);}
  .lamp-status{font-size:12.5px;color:var(--text-dim);margin-top:4px;}

  /* ---- speech bubble ---- */
  .bubble{
    background:var(--bg-card);border:1px solid var(--line-hair);border-radius:14px;
    padding:16px 18px;margin:18px 0;font-family:"Noto Serif SC",serif;
    font-size:15.5px;line-height:1.8;color:var(--text-warm);position:relative;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
  .bubble::before{content:"";position:absolute;left:26px;top:-7px;width:14px;height:14px;background:var(--bg-card);border-left:1px solid var(--line-hair);border-top:1px solid var(--line-hair);transform:rotate(45deg);}

  h2.section{font-size:13px;letter-spacing:0.15em;color:var(--text-dim);text-transform:uppercase;margin:26px 0 10px;font-weight:500;}

  /* ---- task list ---- */
  .task{
    display:flex;align-items:center;gap:12px;background:var(--bg-card);
    border-radius:12px;padding:13px 14px;margin-bottom:9px;border:1px solid var(--line-hair);
  }
  .task.overdue{border-color:rgba(224,120,95,0.5);background:linear-gradient(0deg, rgba(224,120,95,0.08), rgba(224,120,95,0.08)), var(--bg-card);}
  .task.done{opacity:0.5;}
  .task-time{font-family:"Noto Serif SC",serif;font-weight:600;color:var(--accent-gold-soft);font-size:14px;min-width:48px;}
  .task-title{flex:1;font-size:14.5px;}
  .task-title.strike{text-decoration:line-through;color:var(--text-dim);}
  .chk{
    width:26px;height:26px;border-radius:50%;border:1.5px solid var(--accent-gold);
    background:transparent;display:flex;align-items:center;justify-content:center;
    color:var(--accent-gold);font-size:14px;cursor:pointer;flex-shrink:0;
  }
  .chk.on{background:var(--accent-sage);border-color:var(--accent-sage);color:#1c2a1a;}
  .task-del{color:var(--text-dim);opacity:0.5;font-size:16px;cursor:pointer;padding:0 4px;}

  /* ---- add task form ---- */
  .add-row{display:flex;gap:8px;margin-top:6px;}
  input[type=time], input[type=text]{
    background:var(--bg-card-2);border:1px solid var(--line-hair);color:var(--text-warm);
    border-radius:10px;padding:11px 12px;font-family:"Noto Sans SC",sans-serif;font-size:14px;
  }
  input[type=time]{width:104px;}
  input[type=text]{flex:1;min-width:0;}
  input::placeholder{color:var(--text-dim);}
  .btn{
    border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:500;
    cursor:pointer;font-family:"Noto Sans SC",sans-serif;
  }
  .btn-gold{background:var(--accent-gold);color:#2b1e0f;}
  .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--line-hair);}
  .btn-block{width:100%;padding:14px;margin-top:16px;font-size:15px;}

  /* ---- stats strip ---- */
  .stats{display:flex;gap:10px;margin-top:22px;}
  .stat{flex:1;background:var(--bg-card);border-radius:12px;padding:12px 8px;text-align:center;border:1px solid var(--line-hair);}
  .stat .num{font-family:"Noto Serif SC",serif;font-size:20px;font-weight:700;color:var(--accent-gold-soft);}
  .stat .lbl{font-size:11px;color:var(--text-dim);margin-top:2px;}

  /* ---- pet card ---- */
  .pet-card{
    background:linear-gradient(160deg, var(--bg-card-2), var(--bg-card));
    border:1px solid var(--line-hair);border-radius:16px;padding:18px;margin-top:20px;
    display:flex;align-items:center;gap:14px;
  }
  .pet-emoji{font-size:40px;line-height:1;flex-shrink:0;filter:drop-shadow(0 0 10px rgba(217,167,90,0.35));}
  .pet-emoji.pet-dead{filter:grayscale(1) drop-shadow(none);opacity:0.6;}
  .pet-info{flex:1;min-width:0;}
  .pet-name-row{display:flex;align-items:baseline;gap:8px;}
  .pet-name{font-family:"Noto Serif SC",serif;font-weight:700;font-size:15px;color:var(--text-warm);}
  .pet-stage{font-size:11.5px;color:var(--accent-gold-soft);}
  .bar-track{background:rgba(0,0,0,0.28);border-radius:8px;height:8px;margin-top:7px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg, var(--accent-coral), var(--accent-gold));transition:width 0.4s ease;}
  .bar-fill.growth{background:linear-gradient(90deg, var(--accent-sage), var(--accent-gold-soft));}
  .bar-lbl{font-size:10.5px;color:var(--text-dim);margin-top:3px;display:flex;justify-content:space-between;}
  .treats{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .treat-chip{font-size:11px;background:var(--bg-card-2);border:1px solid var(--line-hair);color:var(--accent-gold-soft);padding:4px 9px;border-radius:20px;}
  .treats-empty{font-size:11.5px;color:var(--text-dim);margin-top:10px;}

  /* ---- lock overlay ---- */
  #lockOverlay{
    position:fixed;inset:0;background:rgba(20,12,24,0.97);backdrop-filter:blur(2px);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    z-index:999;padding:36px 28px;text-align:center;
  }
  #lockOverlay.show{display:flex;}
  .lock-badge{font-size:11px;letter-spacing:0.2em;color:var(--accent-coral);text-transform:uppercase;margin-bottom:18px;}
  .lock-text{font-family:"Noto Serif SC",serif;font-size:18px;line-height:2;color:var(--text-warm);max-width:340px;}
  .lock-task{margin-top:8px;font-size:13.5px;color:var(--accent-gold-soft);}
  .hold-btn{
    margin-top:34px;width:180px;height:180px;border-radius:50%;border:2px solid rgba(224,120,95,0.4);
    background:radial-gradient(circle, rgba(224,120,95,0.12), transparent 70%);
    color:var(--text-warm);font-family:"Noto Sans SC",sans-serif;font-size:14px;position:relative;
    display:flex;align-items:center;justify-content:center;user-select:none;cursor:pointer;
  }
  .hold-ring{position:absolute;inset:-2px;border-radius:50%;
    background:conic-gradient(var(--accent-coral) 0deg, transparent 0deg);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
    transition:background 0.05s linear;
  }
  .lock-hint{margin-top:16px;font-size:11.5px;color:var(--text-dim);}

  /* ---- onboarding ---- */
  #onboard{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:12px;}
  #onboard .bubble{text-align:left;}

  /* ---- dead pet banner ---- */
  #deadBanner{
    background:linear-gradient(135deg, #5a2e2e, #3d1f26); border:1px solid rgba(224,120,95,0.5);
    border-radius:12px; padding:13px 16px; margin-bottom:14px; font-size:13.5px; line-height:1.7;
    color:#f5d9cf;
  }
  #deadBanner b{color:var(--accent-coral);}
</style>

<body>
<div id="app">

  <div id="deadBanner" style="display:none;"></div>

  <div class="lamp-wrap">
    <div class="lamp" id="lamp"></div>
    <div class="lamp-name" id="personaName">陆沉</div>
    <div class="lamp-status" id="lampStatus">静静地看着你</div>
  </div>

  <div class="bubble" id="bubbleText">先把今天的计划交给我吧。</div>

  <div id="mainView" style="display:none;">
    <h2 class="section">今日计划</h2>
    <div id="taskList"></div>

    <div class="add-row">
      <input type="time" id="newTime">
      <input type="text" id="newTitle" placeholder="要做的事，比如「背单词 30 分钟」">
    </div>
    <div class="lock-hint" style="text-align:left;margin-top:2px;">不填时间也可以，就是一件不设闹钟的普通待办</div>
    <button class="btn btn-gold btn-block" id="addTaskBtn">加进计划里</button>

    <div class="stats">
      <div class="stat"><div class="num" id="statDone">0</div><div class="lbl">今日完成</div></div>
      <div class="stat"><div class="num" id="statStreak">0</div><div class="lbl">连续达标天</div></div>
      <div class="stat"><div class="num" id="statMiss">0</div><div class="lbl">失约次数</div></div>
    </div>

    <h2 class="section">你们的团子</h2>
    <div class="pet-card">
      <div class="pet-emoji" id="petEmoji">🌰</div>
      <div class="pet-info">
        <div class="pet-name-row">
          <span class="pet-name" id="petName">团子</span>
          <span class="pet-stage" id="petStage">光茧期</span>
        </div>
        <div class="bar-track"><div class="bar-fill" id="petHungerBar" style="width:100%"></div></div>
        <div class="bar-lbl"><span>饱食度</span><span id="petHungerNum">100</span></div>
        <div class="bar-track"><div class="bar-fill growth" id="petGrowthBar" style="width:0%"></div></div>
        <div class="bar-lbl"><span>成长值</span><span id="petGrowthNum">0</span></div>
        <div class="treats" id="petTreats"></div>
      </div>
    </div>

    <h2 class="section">设置</h2>
    <div class="add-row" style="margin-bottom:8px;">
      <input type="text" id="renameInput" placeholder="给TA换个名字">
      <button class="btn btn-ghost" id="renameBtn">改名</button>
    </div>
    <div class="add-row" style="margin-bottom:8px;">
      <input type="text" id="petRenameInput" placeholder="给团子换个名字">
      <button class="btn btn-ghost" id="petRenameBtn">改名</button>
    </div>
    <button class="btn btn-ghost btn-block" id="resetDayBtn">重新开始今天的计划</button>
  </div>

</div>

<div id="lockOverlay">
  <div class="lock-badge">已经超时了</div>
  <div class="lock-text" id="lockText"></div>
  <div class="lock-task" id="lockTaskName"></div>
  <div class="hold-btn" id="holdBtn">
    <div class="hold-ring" id="holdRing"></div>
    <span>按住 3 秒<br>说「我这就去」</span>
  </div>
  <div class="lock-hint">松手会重新计时哦</div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "studyGuardianState_v1";

  var LINES = {
    intro: [
      "先把今天的计划交给我吧，我会一直看着你的。",
      "今天想做什么，说给我听——说了我才好提醒你。",
      "把计划列出来，剩下的交给我就好。"
    ],
    remind: [
      "「{t}」的时间到了，别装作没看见我。",
      "喂，「{t}」该开始了小羽我在这儿等着你。",
      "到点了——「{t}」，起来动一动吧。",
      "「{t}」的时间，我数到十，乖孩子你会开始做了对吗。",
      "不要拖延了小羽「{t}」现在就开始吧。"
    ],
    overdueWarn: [
      "「{t}」已经拖了一会儿了，我有点不高兴。",
      "时间在走，「{t}」还没动静，你是想让我锁屏吗。",
      "最后提醒一次，「{t}」，再不开始坏孩子要受到惩罚了。"
    ],
    lock: [
      "都超时了还在这儿，是想气我吗。「{t}」，现在，立刻，马上去做吧。",
      "说好的「{t}」呢？难道躲着我它就自己消失了吗。",
      "我不是在开玩笑，「{t}」拖到现在，你欠我一个解释小羽。",
      "手都伸到别处去了吧——「{t}」，先把它做完。",
      "我等你，但不会无限地等。「{t}」，快去做吧。"
    ],
    praise: [
      "嗯，这次很乖，我看着呢。",
      "做到了就好，本来就该这样，真棒。",
      "不错，继续保持，我会一直在。",
      "我知道你可以完成这些的。"
    ],
    allDone: [
      "今天的都做完了，辛苦你了，去休息吧。",
      "很好，今天没让我失望。",
      "全部完成——这样我就安心了。"
    ],
    lateWarn: [
      "都快十二点了，今天的计划还没交给我，{p}在等着呢。",
      "还有一点就到点了，再不交计划，{p}今晚可要吃点苦了。",
      "十二点前必须交计划，小羽你忘了吗？{p}还指望你呢。"
    ],
    petSick: [
      "你已经一天没交计划了。{p}蔫蔫地缩在角落，再这样下去我可保不住它。",
      "{p}今天没吃上东西——因为你昨天什么计划都没交。再拖一天，它就撑不住了。"
    ],
    petDied: [
      "{p}没撑住……你已经两天没交计划了。它现在只是安安静静地趴着。今天交一份计划，它就能醒过来。",
      "{p}走了。两天没有任何计划交给我，它等不到你。今天重新交一份计划，它就能复活。"
    ],
    petRevive: [
      "{p}的耳朵动了一下……欢迎回来，我们重新开始。",
      "{p}醒过来了，眼睛亮亮地看着你，好像什么都没发生过一样。"
    ],
    milestone: [
      "连续 {n} 天了，我摸出一颗珍藏的「{f}」，{p}的毛都亮了起来。",
      "第 {n} 天达成，{p}今天格外精神，这颗「{f}」是给它的奖励。"
    ]
  };

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function fill(line, title){ return line.replace("{t}", title); }
  function fillMap(line, map){
    return line.replace(/\{(\w+)\}/g, function(m, k){ return (map[k]!==undefined) ? map[k] : m; });
  }
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function nowHM(){ var d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
  function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

  var GRACE_MIN = 15; // minutes past task time before it's "overdue" (soft warn)
  var LOCK_MIN = 30;   // minutes past task time before hard lock triggers

  var PET_STAGES = [
    { name:"光茧期", min:0,   emoji:"🌰" },
    { name:"绒团期", min:50,  emoji:"🐣" },
    { name:"奔跑期", min:130, emoji:"🐾" },
    { name:"小狐期", min:260, emoji:"🦊" },
    { name:"灵狐期", min:450, emoji:"🦊✨" },
    { name:"耀夜期", min:700, emoji:"🔥🦊" }
  ];
  var TREATS = ["温饱饲料","暖阳莓干","星屑口粮","蜜光糖霜","夜露饲料","龙涎粮"];

  function stageInfo(growth){
    var s = PET_STAGES[0];
    for(var i=0;i<PET_STAGES.length;i++){ if(growth>=PET_STAGES[i].min) s=PET_STAGES[i]; }
    return s;
  }

  var state = load();

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return fresh();
      var s = JSON.parse(raw);
      if(!s.pet){ s.pet = { name:"团子", growth:0, hunger:100, treats:[], dead:false }; }
      if(s.pet.name===undefined) s.pet.name = "团子";
      if(s.pet.dead===undefined) s.pet.dead = false;
      if(s.missedSubmitStreak===undefined) s.missedSubmitStreak = 0;
      s.pendingMessage = null;
      if(s.date !== todayStr()){
        // new day: roll stats, reset tasks (only timed tasks count toward streak/misses)
        var timedYesterday = s.tasks.filter(function(t){return t.time;});
        var missedYesterday = timedYesterday.filter(function(t){return !t.done;}).length;
        var submittedYesterday = !!s.onboarded;

        // hunger: cosmetic, reflects how well timed tasks were kept (does not by itself kill the pet)
        if(submittedYesterday){
          s.pet.hunger -= missedYesterday * 15;
          if(missedYesterday === 0 && timedYesterday.length > 0){ s.pet.growth += 5; } // perfect-day bonus
        } else {
          s.pet.hunger -= 30;
        }
        s.pet.hunger = Math.max(0, Math.min(100, s.pet.hunger));

        // the deadline that actually matters: submitting *some* plan before midnight, every day
        if(!submittedYesterday){
          s.missedSubmitStreak = (s.missedSubmitStreak||0) + 1;
        } else {
          s.missedSubmitStreak = 0;
        }

        if(s.missedSubmitStreak >= 2 && !s.pet.dead){
          s.pet.dead = true;
          s.pet.growth = 0;
          var deadMsg = fillMap(pick(LINES.petDied), {p:s.pet.name});
          s.pendingMessage = { text: deadMsg, mood:"" };
          notify(s.personaName, deadMsg, { requireInteraction:true, tag:"pet-status" });
        } else if(s.missedSubmitStreak === 1){
          var sickMsg = fillMap(pick(LINES.petSick), {p:s.pet.name});
          s.pendingMessage = { text: sickMsg, mood:"urging" };
          notify(s.personaName, sickMsg, { requireInteraction:true, tag:"pet-status" });
        }

        s.streak = submittedYesterday && missedYesterday === 0 ? (s.streak||0)+1 : 0;
        s.totalMiss = (s.totalMiss||0) + missedYesterday;

        if(!s.pet.dead && !s.pendingMessage && s.streak>0 && s.streak%5===0){
          var treat = TREATS[Math.floor(s.streak/5 - 1) % TREATS.length];
          s.pet.growth += 12;
          s.pet.hunger = 100;
          s.pet.treats.push(treat);
          s.pendingMessage = { text: fillMap(pick(LINES.milestone), {n:s.streak, f:treat, p:s.pet.name}), mood:"bloom" };
        }

        s.tasks = [];
        s.date = todayStr();
        s.onboarded = false;
        s.lateWarned = false;
      }
      return s;
    }catch(e){ return fresh(); }
  }
  function fresh(){
    return { date: todayStr(), personaName:"陆沉", tasks:[], streak:0, totalMiss:0, onboarded:false,
      pet:{ name:"团子", growth:0, hunger:100, treats:[], dead:false }, missedSubmitStreak:0,
      lateWarned:false, pendingMessage:null };
  }
  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

  function feedPet(hungerDelta, growthDelta){
    if(state.pet.dead) return; // no progress while dead; must be revived first
    state.pet.hunger = Math.max(0, Math.min(100, state.pet.hunger + hungerDelta));
    state.pet.growth = Math.max(0, state.pet.growth + growthDelta);
  }

  // ---- DOM refs ----
  var el = {
    lamp: document.getElementById("lamp"),
    lampStatus: document.getElementById("lampStatus"),
    personaName: document.getElementById("personaName"),
    bubble: document.getElementById("bubbleText"),
    mainView: document.getElementById("mainView"),
    taskList: document.getElementById("taskList"),
    newTime: document.getElementById("newTime"),
    newTitle: document.getElementById("newTitle"),
    addTaskBtn: document.getElementById("addTaskBtn"),
    statDone: document.getElementById("statDone"),
    statStreak: document.getElementById("statStreak"),
    statMiss: document.getElementById("statMiss"),
    renameInput: document.getElementById("renameInput"),
    renameBtn: document.getElementById("renameBtn"),
    resetDayBtn: document.getElementById("resetDayBtn"),
    lockOverlay: document.getElementById("lockOverlay"),
    lockText: document.getElementById("lockText"),
    lockTaskName: document.getElementById("lockTaskName"),
    holdBtn: document.getElementById("holdBtn"),
    holdRing: document.getElementById("holdRing"),
    petEmoji: document.getElementById("petEmoji"),
    petName: document.getElementById("petName"),
    petStage: document.getElementById("petStage"),
    petHungerBar: document.getElementById("petHungerBar"),
    petHungerNum: document.getElementById("petHungerNum"),
    petGrowthBar: document.getElementById("petGrowthBar"),
    petGrowthNum: document.getElementById("petGrowthNum"),
    petTreats: document.getElementById("petTreats"),
    deadBanner: document.getElementById("deadBanner"),
    petRenameInput: document.getElementById("petRenameInput"),
    petRenameBtn: document.getElementById("petRenameBtn")
  };

  function setBubble(text, mood){
    el.bubble.textContent = text;
    el.lamp.className = "lamp" + (mood ? " "+mood : "");
    var statusMap = { urging:"有点着急了", locked:"在等你回应", bloom:"今天很满意", "":"静静地看着你" };
    el.lampStatus.textContent = statusMap[mood||""] || "静静地看着你";
  }

  function render(){
    el.personaName.textContent = state.personaName;
    el.mainView.style.display = "block";
    if(state.pendingMessage){
      setBubble(state.pendingMessage.text, state.pendingMessage.mood);
      state.pendingMessage = null;
      save();
    } else if(state.tasks.length === 0 && !state.onboarded){
      setBubble(pick(LINES.intro));
    }
    renderTasks();
    renderStats();
    renderPet();
  }

  function renderPet(){
    var g = state.pet.growth, h = state.pet.hunger;
    var stage = stageInfo(g);
    var nextIdx = PET_STAGES.indexOf(stage) + 1;
    var nextMin = nextIdx < PET_STAGES.length ? PET_STAGES[nextIdx].min : null;
    el.petName.textContent = state.pet.name;
    el.petEmoji.textContent = state.pet.dead ? "💤" : stage.emoji;
    el.petEmoji.className = "pet-emoji" + (state.pet.dead ? " pet-dead":"");
    el.petStage.textContent = state.pet.dead ? "沉睡中" : stage.name;
    el.petHungerBar.style.width = h + "%";
    el.petHungerNum.textContent = Math.round(h);
    var growthPct = nextMin ? Math.min(100, Math.round((g - stage.min) / (nextMin - stage.min) * 100)) : 100;
    el.petGrowthBar.style.width = growthPct + "%";
    el.petGrowthNum.textContent = g + (nextMin ? ("  ·  再涨 "+(nextMin-g)+" 点进阶") : "  ·  已满级");
    if(state.pet.treats.length){
      el.petTreats.innerHTML = state.pet.treats.map(function(t){ return '<span class="treat-chip">'+escapeHtml(t)+'</span>'; }).join("");
    } else {
      el.petTreats.innerHTML = '<span class="treats-empty">连续达标 5 天，'+escapeHtml(state.pet.name)+'会收到第一份饲料</span>';
    }
    if(state.pet.dead){
      el.deadBanner.style.display = "block";
      el.deadBanner.innerHTML = "<b>"+escapeHtml(state.pet.name)+" 已经睡过去了</b> —— 连续两天没有提交计划。今天只要交一份计划，它就能醒过来（成长值会清零，重新养起）。";
    } else {
      el.deadBanner.style.display = "none";
    }
  }

  function renderTasks(){
    el.taskList.innerHTML = "";
    var sorted = state.tasks.slice().sort(function(a,b){
      if(!a.time && !b.time) return 0;
      if(!a.time) return 1;
      if(!b.time) return -1;
      return a.time.localeCompare(b.time);
    });
    sorted.forEach(function(t){
      var div = document.createElement("div");
      div.className = "task" + (t.done?" done":"") + (t.time && isOverdue(t) && !t.done ? " overdue":"");
      div.innerHTML =
        '<div class="task-time">'+(t.time || "随时")+'</div>'+
        '<div class="task-title'+(t.done?" strike":"")+'">'+escapeHtml(t.title)+'</div>'+
        '<div class="chk'+(t.done?" on":"")+'" data-id="'+t.id+'">'+(t.done?"✓":"")+'</div>'+
        '<div class="task-del" data-id="'+t.id+'">✕</div>';
      el.taskList.appendChild(div);
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; });
  }

  function renderStats(){
    var done = state.tasks.filter(function(t){return t.done;}).length;
    el.statDone.textContent = done + "/" + state.tasks.length;
    el.statStreak.textContent = state.streak || 0;
    el.statMiss.textContent = state.totalMiss || 0;
  }

  function isOverdue(t){
    if(!t.time) return false;
    return minutesPast(t.time) >= GRACE_MIN;
  }
  function minutesPast(hm){
    var parts = hm.split(":");
    var target = new Date();
    target.setHours(parseInt(parts[0],10), parseInt(parts[1],10), 0, 0);
    var diffMs = Date.now() - target.getTime();
    return diffMs/60000;
  }

1  // ---- events ----
  el.addTaskBtn.addEventListener("click", function(){
    var time = el.newTime.value; // may be empty -> open-ended task, no timer/lock
    var title = el.newTitle.value.trim();
    if(!title) return;
    var firstSubmitToday = !state.onboarded;
    var wasDead = state.pet.dead;
    state.tasks.push({ id: Date.now()+"", time: time || "", title: title, done:false, warned:false, lockShown:false });
    state.onboarded = true;
    if(wasDead){
      state.pet.dead = false;
      state.pet.hunger = 50;
      state.missedSubmitStreak = 0;
      save(); render();
      setBubble(fillMap(pick(LINES.petRevive), {p:state.pet.name}), "bloom");
      el.newTitle.value = ""; el.newTime.value = "";
      return;
    }
    if(firstSubmitToday){ feedPet(8, 2); }
    el.newTitle.value = "";
    el.newTime.value = "";
    save(); render();
    setBubble(time ? ("「"+title+"」，"+time+"，我记下了小羽，到点我会叫你。") : ("「"+title+"」，我记下了，记得做完了就来打卡小羽。"));
  });

  el.taskList.addEventListener("click", function(e){
    var id = e.target.getAttribute("data-id");
    if(!id) return;
    if(e.target.classList.contains("chk")){
      var t = state.tasks.find(function(x){return x.id===id;});
      if(t){
        t.done = !t.done;
        if(t.done){ feedPet(10, 3); } else { feedPet(-10, -3); }
        save(); render();
        if(t.done){
          var allDone = state.tasks.length>0 && state.tasks.every(function(x){return x.done;});
          if(allDone){ setBubble(pick(LINES.allDone), "bloom"); }
          else { setBubble(pick(LINES.praise)); }
        }
      }
    } else if(e.target.classList.contains("task-del")){
      state.tasks = state.tasks.filter(function(x){return x.id!==id;});
      save(); render();
    }
  });

  el.renameBtn.addEventListener("click", function(){
    var v = el.renameInput.value.trim();
    if(v){ state.personaName = v; el.renameInput.value=""; save(); render(); }
  });

  el.petRenameBtn.addEventListener("click", function(){
    var v = el.petRenameInput.value.trim();
    if(v){ state.pet.name = v; el.petRenameInput.value=""; save(); render(); }
  });

  el.resetDayBtn.addEventListener("click", function(){
    if(confirm("清空今天已添加的计划？")){
      state.tasks = [];
      state.onboarded = false;
      save(); render();
    }
  });

  // ---- notification permission (best effort; needs the tab/app open to fire) ----
  if("Notification" in window && Notification.permission === "default"){
    document.addEventListener("click", function once(){
      Notification.requestPermission();
      document.removeEventListener("click", once);
    }, { once:true });
  }
  function notify(title, body, opts){
    if("Notification" in window && Notification.permission === "granted"){
      try{ new Notification(title, Object.assign({ body: body }, opts||{})); }catch(e){}
    }
  }

  // ---- lock overlay + hold-to-dismiss ----
  var holdTimer=null, holdStart=null;
  var HOLD_MS = 3000;
  var currentLockTaskId = null;

  function showLock(t){
    currentLockTaskId = t.id;
    el.lockText.textContent = fill(pick(LINES.lock), t.title);
    el.lockTaskName.textContent = "「"+t.title+"」 · 已超时 "+Math.floor(minutesPast(t.time))+" 分钟";
    el.lockOverlay.classList.add("show");
    document.body.style.overflow = "hidden";
    setBubble("在等你回应", "locked");
  }
  function hideLock(){
    el.lockOverlay.classList.remove("show");
    document.body.style.overflow = "";
    var t = state.tasks.find(function(x){return x.id===currentLockTaskId;});
    if(t){ t.lockShown = false; } // allow it to re-trigger later if still not done
  }

  function startHold(e){
    e.preventDefault();
    holdStart = Date.now();
    holdTimer = requestAnimationFrame(step);
  }
  function step(){
    var elapsed = Date.now() - holdStart;
    var pct = Math.min(elapsed/HOLD_MS, 1);
    el.holdRing.style.background = "conic-gradient(var(--accent-coral) "+(pct*360)+"deg, transparent "+(pct*360)+"deg)";
    if(pct >= 1){
      cancelAnimationFrame(holdTimer);
      el.holdRing.style.background = "conic-gradient(var(--accent-coral) 0deg, transparent 0deg)";
      hideLock();
    } else {
      holdTimer = requestAnimationFrame(step);
    }
  }
  function cancelHold(){
    if(holdTimer) cancelAnimationFrame(holdTimer);
    el.holdRing.style.background = "conic-gradient(var(--accent-coral) 0deg, transparent 0deg)";
  }
  el.holdBtn.addEventListener("mousedown", startHold);
  el.holdBtn.addEventListener("touchstart", startHold, {passive:false});
  ["mouseup","mouseleave","touchend","touchcancel"].forEach(function(ev){
    el.holdBtn.addEventListener(ev, cancelHold);
  });

  // ---- the tick: checks tasks against clock ----
  function tick(){
    if(el.lockOverlay.classList.contains("show")) return; // don't stack states while locked
    var now = nowHM();
    var toLock = null;
    state.tasks.forEach(function(t){
      if(t.done || !t.time) return;
      var mp = minutesPast(t.time);
      if(mp >= 0 && mp < GRACE_MIN && !t.warned){
        t.warned = true;
        var msg = fill(pick(LINES.remind), t.title);
        setBubble(msg, "urging");
        notify(state.personaName, msg);
      } else if(mp >= GRACE_MIN && mp < LOCK_MIN && !t.overdueWarned){
        t.overdueWarned = true;
        var msg2 = fill(pick(LINES.overdueWarn), t.title);
        setBubble(msg2, "urging");
        notify(state.personaName, msg2);
      } else if(mp >= LOCK_MIN && !t.lockShown){
        t.lockShown = true;
        toLock = t;
      }
    });
    if(toLock){ feedPet(-15, 0); }

    // pre-midnight deadline reminder: today's plan must be submitted before 24:00
    if(!state.onboarded && !state.lateWarned && now >= "23:00"){
      state.lateWarned = true;
      var lateMsg = fillMap(pick(LINES.lateWarn), {p: state.pet.name});
      setBubble(lateMsg, "urging");
      notify(state.personaName, lateMsg);
    }

    save();
    if(toLock) showLock(toLock);
    renderTasks();
    renderPet();
  }

  setInterval(tick, 15000);
  render();
  tick();
})();
</script>
</body>
</html>
